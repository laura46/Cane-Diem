<!DOCTYPE html>
<html lang="de" data-theme="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cane Diem</title>
  <meta name="description" content="Cane Diem – Premium Hundeerlebnisse in Brixen, Eisacktal, Südtirol.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baskervville:wght@400;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="de" aria-pressed="true">DE</button>
      <button type="button" data-lang="it" aria-pressed="false">IT</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <div class="theme" role="group" aria-label="Theme" id="themes"></div>
  </header>

  <main>
    <div class="logo">
      <img id="logo" alt="Cane Diem" hidden>
      <span id="wordmark" class="wordmark">Cane Diem</span>
    </div>
    <p class="eyebrow" data-i18n="soon"></p>
    <h1 data-i18n="headline"></h1>
    <div class="rule"></div>
    <p class="vip" data-i18n="vip"></p>
    <p class="area">Brixen · Eisacktal · Südtirol</p>
    <p class="contact"><span data-i18n="contact"></span><br>
      <a href="mailto:info@cane-diem.bz">info@cane-diem.bz</a></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
